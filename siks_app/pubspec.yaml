name: siks_app
description: SIKS Al Amin - Sistem Informasi Keuangan Sekolah SMK Al Amin
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # WebView
  webview_flutter: ^4.10.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Local Notifications (for FCM foreground)
  flutter_local_notifications: ^18.0.1

  # Image picker (galeri + kamera)
  image_picker: ^1.1.2

  # Share PDF / file
  share_plus: ^10.0.0

  # Deep linking
  app_links: ^6.3.2

  # Connectivity check
  connectivity_plus: ^6.0.5

  # Cache (untuk download PDF sementara)
  flutter_cache_manager: ^3.3.2

  # Storage
  shared_preferences: ^2.3.3

  # Path utilities
  path_provider: ^2.1.4
  path: ^1.9.0

  # Permission handler
  permission_handler: ^11.3.1

  # URL launcher (buka WhatsApp, browser eksternal, dll)
  url_launcher: ^6.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

# Splash screen config
flutter_native_splash:
  color: "#f8fafc"
  image: assets/images/logo.png
  android: true
  ios: false
  android_12:
    color: "#f8fafc"
    image: assets/images/logo.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo.png"
